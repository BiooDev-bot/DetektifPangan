# Update otomatis RadarPangan: scrape data terbaru -> fitur -> prediksi -> deploy dashboard ke Vercel.
name: Update dashboard RadarPangan

on:
  schedule:
    - cron: "0 10 * * 1-5"        # 10.00 UTC = 17.00 WIB, Senin-Jumat
  workflow_dispatch:
    inputs:
      retrain:
        description: "Latih ulang model?"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: radarpangan-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      VERCEL_ORG_ID: team_r4iJ0fmEfTJDnQYqFwhY0o28
      VERCEL_PROJECT_ID: prj_ssGq50PdDcUnblkq91OSqHIxMUlC
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Update data, prediksi, dan dashboard
        run: |
          if [ "${{ github.event.inputs.retrain }}" = "true" ]; then
            python run_pipeline.py update --retrain
          else
            python run_pipeline.py update
          fi

      - name: Simpan cache data & model terbaru ke repo
        run: |
          git config user.name "radarpangan-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/raw data/external data/output models reports/tables
          git commit -m "Update data $(date -u +%Y-%m-%d)" || echo "Tidak ada perubahan"
          git push

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Deploy dashboard ke Vercel (production)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx --yes vercel@latest deploy site --prod --yes --token "$VERCEL_TOKEN"

      - name: Verifikasi dashboard live sudah memakai data terbaru
        run: |
          want=$(python -c "import json;print(json.load(open('site/data/meta.json'))['generated_at'])")
          for i in 1 2 3 4 5 6; do
            got=$(curl -fsS "https://radarpangan.vercel.app/data/meta.json?ts=$(date +%s)" \
                  | python -c "import sys,json;print(json.load(sys.stdin)['generated_at'])") || got=""
            echo "live generated_at=$got | lokal=$want"
            [ "$got" = "$want" ] && exit 0
            sleep 10
          done
          echo "Dashboard live belum menampilkan data terbaru"; exit 1
